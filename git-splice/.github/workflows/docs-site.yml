name: Documentation site

# Builds website/ and deploys it to GitHub Pages (Settings -> Pages ->
# Source: GitHub Actions). Pull requests only build it, in the CI workflow,
# where broken links fail.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Whole runs one at a time, build included, so an older build can't deploy
# after a newer one. A newer push replaces a queued run; a running deploy
# is never cancelled halfway.
concurrency:
  group: docs-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@9383ce2bf08796b65508822f5982f49151badc4e # main
      - uses: DeterminateSystems/magic-nix-cache-action@f69a2d3e148e90223fe63ab6e3f6331f2e7e33dc # main
      - uses: ./.github/actions/scrut-cache

      - name: build
        run: nix develop --command just site-build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
