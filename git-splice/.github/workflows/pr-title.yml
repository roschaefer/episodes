name: PR title

# PRs are squash-merged with the title as the commit message, and
# release-please builds the changelog from those messages: a title that
# isn't a Conventional Commit drops the change from the release notes.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
